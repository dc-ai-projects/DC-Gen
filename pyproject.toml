[tool.black]
line-length = 120
workers = 8

[tool.isort]
profile = "black"
skip_gitignore = true
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
follow_links = false

[tool.pyright]
exclude = ["exp*", "assets", "wandb", "tmp*", "dc_ai/c2icore/diffusioncore/efficiency/onnx", "dc_ai/c2icore/diffusioncore/efficiency/training_efficiency", "dc_ai/c2icore/diffusioncore/efficiency/*.json"]

[tool.pylint]
    disable = [
        "C0114",
        "C0115",
        "C0116",
        "C0206",
        "C0301",
        "C0415",
        "E0402",
        "W0105",
        "W0223",
        "W1309",
    ]
